name: Publish to NuGet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.x"

      - name: Restore dependencies
        run: dotnet restore Farsight.Common.slnx

      - name: Build the project
        run: dotnet build Farsight.Common.slnx --configuration Release --no-restore -warnaserror

      - name: Pack the project
        run: dotnet pack src/Farsight.Common --configuration Release --no-build --output ./nupkgs

      - name: Log in to NuGet
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        shell: bash
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate
